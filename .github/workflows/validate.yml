name: Alpha checks
on:
  push:
    branches: [main]
  pull_request:
    paths: ['content/**', 'backend/content.py', 'requirements.lock.txt', '.github/workflows/validate.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  data-only:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: candidate
          persist-credentials: false
      - name: Validate candidate data with trusted baseline code
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r trusted/requirements.lock.txt
          cd trusted
          ../.venv/bin/python -m scripts.validate_content ../candidate/content/cases
  code-checks:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements.lock.txt
          mkdir -p .local
          .venv/bin/python -m pytest -q
          .venv/bin/python -m ruff check backend tests scripts experiments
          cd web
          npm ci
          npm run build
          npm run lint
          npm test
